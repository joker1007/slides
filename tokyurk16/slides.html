</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" lang="en-US">
<h1 id="%E7%9C%9F%E3%81%AE%E3%82%BF%E3%82%A4%E3%83%88%E3%83%AB-rubyist%E3%81%AB5%E5%88%86%E3%81%A7%E5%8F%A9%E3%81%8D%E8%BE%BC%E3%82%80linux-tips-40">真のタイトル: Rubyistに5分で叩き込むLinux Tips 40</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" lang="en-US">
<h1 id="%E8%83%8C%E6%99%AF">背景</h1>
<p>OmarchyのおかげでLinuxちょっと使ってみようかという人が増えた気がする。<br />
自分はずっとMacより全然使い易いと思っている。<br />
Macを使っていた時期はあるが9割以上iPhoneとiTunesのためだった。<br />
という訳でRubyistにLinuxで困ることは何もないということを伝えたい。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" lang="en-US">
<h1 id="linux%E3%81%AE%E4%BD%BF%E3%81%84%E5%8B%9D%E6%89%8B%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6">Linuxの使い勝手について</h1>
<p>Linuxは基本的にある目的を達成するソフトウェアをどれだけ知っているかで概ね使い勝手が決まる。<br />
そして、調べる場所が分かればどうにかなる。<br />
大事なのは名前と調べる場所を知っていること。</p>
<p>Linuxは自由な分選択肢が多いので、今回は自分のオススメも詰め込んである。<br />
大体これ選んでおけばOKなやつ。</p>
<p>という訳で5分間で叩き込むから着いてきてくれ！</p>
<p>(多分着いてこれんので資料公開したやつを見てくれ)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" lang="en-US">
<h1 id="1-man">1. man</h1>
<p>Macでも余り変わらないが、困った時はとりあえずmanでマニュアルを見ること。<br />
manにはセクションという概念があり、CLIのマニュアルだけでなく設定ファイルのフォーマットとかsystem callのマニュアルも書いてある。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sh">man jq
man 5 systemd.unit
man 2 recv
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" lang="en-US">
<h1 id="2-%E5%90%84%E7%A8%AEpath">2. 各種PATH</h1>
<p>コマンド実行のためのPATHだけでなく色々なPATHが存在する。<br />
あんまり直接弄ることはないが、ソースから何かをコンパイルする時には自分で設定しなければいけない時もある。</p>
<ul>
<li>LD_LIBRARY_PATH: 実行時のDLLを探す場所。/etc/ld.so.confに設定しておけば良いので直接弄ることは余りない</li>
<li>PKG_CONFIG_PATH: pkg-config(コンパイル時に必要な情報を記録して参照可能にしてくれる)を探す場所。</li>
<li>MANPATH: manを探す場所。システムのパッケージマネージャー以外でインストールすると他の場所にmanが入っててmanコマンドで見れない場合がある。</li>
<li>C_INCLUDE_PATH, CPLUS_INCLUDE_PATH: C系のヘッダファイルを探す場所。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" lang="en-US">
<h1 id="3-systemd">3. systemd</h1>
<p>システム全体のプロセス起動・管理を行う。カーネルがPID1として起動する。<br />
やたら多機能。(Unixっぽくないので嫌いな人が一定居てよく燃えてる)<br />
現実として、こいつがシステムの基本的な動作の大半に絡むので覚えておく必要がある。</p>
<p>ここから少しの間systemdのよく使うものについて話をする</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" lang="en-US">
<h1 id="4-systemctl%E3%81%A8unit%E3%83%95%E3%82%A1%E3%82%A4%E3%83%AB">4. systemctlとunitファイル</h1>
<p>めちゃくちゃざっくり言えば、デーモンプロセス、mount設定、socketサービス、timer、それらの依存関係を記述するのがunitファイルで、それの自動起動や状態の管理などを行うコマンドが<code>systemctl</code>。<br />
例えばsshdの自動起動なんかを管理してるので、その辺りから見てみるのが良い。<br />
なんらか自動起動したい時はこれを書けば良い。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sh">systemctl --list-unit-files <span class="hljs-comment"># 認識されているunitファイルのリスト</span>
systemctl <span class="hljs-built_in">cat</span> sshd.service <span class="hljs-comment"># sshd起動のための設定</span>
systemctl <span class="hljs-built_in">enable</span> sshd.service <span class="hljs-comment"># 自動起動を有効にする</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" lang="en-US">
<h1 id="unit%E3%83%95%E3%82%A1%E3%82%A4%E3%83%AB%E3%81%AE%E4%BE%8B">unitファイルの例</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[Unit]
Description=OpenSSH server daemon
After=network.target auditd.service # network関係の依存関係をまとめるtarget処理が終わった後に起動する

[Service]
Type=notify-reload # systemdにプロセスの起動完了を伝える方法
ExecStartPre=/usr/bin/ssh-keygen -A # 起動前に行うコマンド
ExecStart=/usr/sbin/sshd -D -e # 起動に利用するコマンド
KillMode=process # プロセスの終了のさせ方
OOMPolicy=continue # OOMが起きた時どうするか
Restart=on-failure # どういう状況で再起動するか
RestartSec=42s

[Install]
WantedBy=multi-user.target # enableした時に規定で登録するtarget
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" lang="en-US">
<h1 id="%E8%A9%B3%E7%B4%B0%E3%81%AF%E3%81%93%E3%81%93">詳細はここ</h1>
<p>詳しく知りたくなったらArchWikiと公式docへ。</p>
<ul>
<li><a href="https://wiki.archlinux.jp/index.php/Systemd">https://wiki.archlinux.jp/index.php/Systemd</a></li>
<li><a href="https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html">https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html</a></li>
<li><a href="https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html">https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" lang="en-US">
<h1 id="5-x%E3%81%A8wayland">5. XとWayland</h1>
<p>LinuxでGUIアプリ(ウインドウシステム)を提供する仕組みとして長く使われてきたのがXである。<br />
そのための設定ファイルや起動スクリプトなどが諸々あったが、最近のLinuxではWaylandプロトコルに移行しつつある。<br />
Waylandでは基本的にX時代の設定ファイルは無視される。設定は個別のウインドウマネージャーで行う。</p>
<p>詳しくはArchWikiへ。<br />
<a href="https://wiki.archlinux.jp/index.php/Wayland">https://wiki.archlinux.jp/index.php/Wayland</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" lang="en-US">
<h1 id="6-uwsm-universal-wayland-session-manager">6. uwsm (Universal Wayland Session Manager)</h1>
<p>waylandを利用するウインドウマネージャーで、systemdを利用していい感じにアプリの自動起動とか出来る様にしてくれる。<br />
とても説明できないので、詳しくは俺のブログを読んでくれ。</p>
<ul>
<li><a href="https://joker1007.hatenablog.com/entry/2025/10/02/222603">https://joker1007.hatenablog.com/entry/2025/10/02/222603</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" lang="en-US">
<h1 id="7-hyprland%E3%81%AE%E3%81%A1%E3%82%87%E3%81%A3%E3%81%A8%E3%81%97%E3%81%9Ftips">7. HyprlandのちょっとしたTips</h1>
<p>windowruleは便利なのでちゃんと設定しておこう。動画見てたりMeeting中にdimがかからない様にするとか。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>windowrule = nodim,class:^(google-chrome.*),title:^(.*YouTube.*)$
windowrule = nodim,class:^(google-chrome.*),title:^(.*Netflix.*)$
windowrule = nodim,class:^(google-chrome.*),title:^(.*Prime Video.*)$
windowrule = nodim,class:^(google-chrome.*),title:^(.*Twitch.*)$
windowrule = nodim,class:^(google-chrome.*),title:^(Meet.*)$
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" lang="en-US">
<h1 id="8-terminal">8. Terminal</h1>
<p>この辺りがオススメ、他のターミナルは遅い</p>
<ul>
<li><a href="https://alacritty.org/">alacritty</a> (シンプル、有名)</li>
<li><a href="https://codeberg.org/dnkl/foot">foot</a> (wayland専用、多機能)</li>
<li><a href="https://ghostty.org/">ghostty</a> (必要十分)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" lang="en-US">
<h1 id="9-%E3%82%BF%E3%82%B9%E3%82%AF%E3%83%90%E3%83%BC">9. タスクバー</h1>
<p><a href="github.com/Alexays/Waybar">waybar</a>で良い。カスタマイズが簡単で必要なものは大体ある。</p>
<p>ドキュメント<br />
<a href="https://github.com/Alexays/Waybar/wiki">https://github.com/Alexays/Waybar/wiki</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" lang="en-US">
<h1 id="10-%E3%83%A9%E3%83%B3%E3%83%81%E3%83%A3%E3%83%BC">10. ランチャー</h1>
<p>以下は個人的なオススメ。</p>
<ul>
<li><a href="https://github.com/SimplyCEO/wofi">wofi</a> (シンプル)</li>
<li><a href="https://benz.gitbook.io/walker/">walker &amp; elephant</a> (elephantがバックエンドで検索と表示などを行う、walkerはフロントエンド)</li>
</ul>
<p>シェルスクリプトと組み合わせるならwofiの方が楽。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" lang="en-US">
<h1 id="wofi%E3%81%A7%E3%82%AA%E3%83%BC%E3%83%87%E3%82%A3%E3%82%AA%E3%81%AE%E5%87%BA%E5%8A%9B%E5%85%88%E3%82%92%E5%A4%89%E6%9B%B4%E3%81%99%E3%82%8B%E4%BE%8B">wofiでオーディオの出力先を変更する例</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sh"><span class="hljs-meta">#!/bin/bash</span>

<span class="hljs-built_in">id</span>=$(pw-dump Node | jq -r <span class="hljs-string">&#x27;map({id: .id, class: .info.props[&quot;media.class&quot;], desc: .info.props[&quot;node.description&quot;]} | select(.desc != null)) | sort_by(.class, .desc) | .[] | [.id, .class, .desc] | @tsv&#x27;</span> | wofi -di | <span class="hljs-built_in">cut</span> -f 1)

<span class="hljs-keyword">if</span> [ -n <span class="hljs-string">&quot;<span class="hljs-variable">$id</span>&quot;</span> ]; <span class="hljs-keyword">then</span>
  <span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;Setting default to <span class="hljs-variable">$id</span>&quot;</span>
  wpctl set-default <span class="hljs-variable">$id</span>
<span class="hljs-keyword">fi</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" lang="en-US">
<h1 id="11-filer">11. Filer</h1>
<p>Omarchyから来ているHyprlandユーザーならThunarが良いと思う。<br />
Xfceデスクトップの基本ファイルマネージャーだが、依存で必要になるものが少ない。<br />
次点でpcmanfm-qtかな。</p>
<p>CLIなら今は<a href="https://yazi-rs.github.io/docs/installation">yazi</a>一択で良い。<br />
シェルスクリプトメインで自分でカスタムしたい人は<a href="https://github.com/jarun/nnn">nnn</a>がオススメ。</p>
<p>もっと試したい人はArchWikiで。<br />
<a href="https://wiki.archlinux.jp/index.php/%E3%82%A2%E3%83%97%E3%83%AA%E3%82%B1%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E4%B8%80%E8%A6%A7/%E3%83%A6%E3%83%BC%E3%83%86%E3%82%A3%E3%83%AA%E3%83%86%E3%82%A3#.E3.83.95.E3.82.A1.E3.82.A4.E3.83.AB.E3.83.9E.E3.83.8D.E3.83.BC.E3.82.B8.E3.83.A3">https://wiki.archlinux.jp/index.php/アプリケーション一覧/ユーティリティ#.E3.83.95.E3.82.A1.E3.82.A4.E3.83.AB.E3.83.9E.E3.83.8D.E3.83.BC.E3.82.B8.E3.83.A3</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" lang="en-US">
<h1 id="12-%E3%83%97%E3%83%AC%E3%82%BC%E3%83%B3%E3%83%84%E3%83%BC%E3%83%AB">12. プレゼンツール</h1>
<p>実は割と不毛。<br />
pdf化して、<a href="https://github.com/pdfpc/pdfpc">pdfpc</a>を使うか<a href="https://github.com/Cimbali/pympress/">pympress</a>を使うのが良いかと思う。<br />
デュアルモニタで発表者画面とプレゼン画面を分けて出せる。<br />
ノートも書ける。</p>
<p>後はもうGoogleとかWebサービスに頼る。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" lang="en-US">
<h1 id="13-%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF">13. ネットワーク</h1>
<p>NetworkManagerかsystemd-networkdのどちらかで管理する。</p>
<p>デスクトップPCでシンプルに設定したいならsystemd-networkdがオススメ。余計なものが入らない。</p>
<p>Wifiをよく切り替えるノートPCならNetworkManagerがシステムトレイとかまとめて用意してくれるのでオススメ。</p>
<p>自分は大抵systemd-networkdを使っている。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" lang="en-US">
<h1 id="14-wifi">14. Wifi</h1>
<p>wpa_supplicantが必要。しばしばハマるので詳しくはArchWikiへ。<br />
NetworkManagerなら大体勝手になんとかしてくれるはず。<br />
<a href="https://wiki.archlinux.jp/index.php/Wpa_supplicant">https://wiki.archlinux.jp/index.php/Wpa_supplicant</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" lang="en-US">
<h1 id="15-%E9%9F%B3%E5%A3%B0%E5%87%BA%E5%8A%9B%E3%81%A8pipewire">15. 音声出力とpipewire</h1>
<p>PulseAudioの時代は大体終わりを告げており、Pipewireが主流になってる。<br />
<code>~/.config/pipewire</code>に基本設定を書いて、<code>~/.config/wireplumber</code>にデバイス特有の設定などを書く。<br />
よく使うコマンドは以下。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sh">pw-top <span class="hljs-comment"># pipewireの動作モニタ</span>
pw-dump <span class="hljs-comment"># 現在の設定をJSONで出力してくれる</span>
wpctl <span class="hljs-comment"># wireplubmerの設定表示やメインの入出力デバイスの変更など</span>

</code></pre>
<p>詳しくはArchWikiへ<br />
<a href="https://wiki.archlinux.jp/index.php/PipeWire">https://wiki.archlinux.jp/index.php/PipeWire</a><br />
<a href="https://wiki.archlinux.jp/index.php/WirePlumber">https://wiki.archlinux.jp/index.php/WirePlumber</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" lang="en-US">
<h1 id="pipewire%E9%96%A2%E9%80%A3%E3%83%84%E3%83%BC%E3%83%AB">Pipewire関連ツール</h1>
<p><a href="https://gitlab.freedesktop.org/rncbc/qpwgraph">qpwgraph</a>をインストールしておくのが良い。</p>
<p>グラフィカルにどのアプリがどのデバイスと繋がっているかが分かるし、繋ぎ変えもできる。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" lang="en-US">
<h1 id="16-bluetooth">16. bluetooth</h1>
<p>bluezというソフトウェアがBluetoothを管理している。bluetoothdが起動している必要があるのでsystemdで有効にすること。<br />
GUI管理ツールとしては<a href="https://github.com/blueman-project/blueman">Blueman</a>がオススメ。<br />
しかし、結構ハマるのでログとか確認しつつやるなら<code>bluetoothctl</code>コマンドに慣れた方がいいかも。<br />
ヘッドセットを上手く動かすにはPipewireの設定が必要になる場合がある。</p>
<p>詳しくはArchWikiへ。<br />
<a href="https://wiki.archlinux.jp/index.php/Bluetooth">https://wiki.archlinux.jp/index.php/Bluetooth</a><br />
<a href="https://wiki.archlinux.jp/index.php/Bluetooth_%E3%83%98%E3%83%83%E3%83%89%E3%82%BB%E3%83%83%E3%83%88">https://wiki.archlinux.jp/index.php/Bluetooth_ヘッドセット</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" lang="en-US">
<h1 id="17-%E3%83%91%E3%82%B9%E3%83%AF%E3%83%BC%E3%83%89%E7%AE%A1%E7%90%86">17. パスワード管理</h1>
<p>gnome-keyringとかKDE Walletなどがあるが、1passwordにお金払ってるのが一番良いと思う。<br />
スマホや他のPCで使う時に困らないし、普通にLinux版がある。<br />
システム認証と連携する設定をすることで、OSのパスワードやYubikeyでロック解除が出来る。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" lang="en-US">
<h1 id="18-polkit">18. polkit</h1>
<p>polkitはGUI向けのsudoみたいなもので、1passwordの様なプロセスが認証を必要とする時や特権を一時的に一般ユーザーに与える時に利用する。設定ファイルは/usr/share/polkitにある。<br />
認証を行うためにエージェントフロントエンドが必要。Hyprlandなら<a href="https://github.com/hyprwm/hyprpolkitagent">hyprpolkitagent</a>が公式にメンテされている。<br />
基本的にwheelグループに入っていれば管理者権限を引き受けられる。</p>
<p>詳しくはArchWikiへ。<br />
<a href="https://wiki.archlinux.jp/index.php/Polkit">https://wiki.archlinux.jp/index.php/Polkit</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" lang="en-US">
<h1 id="19-pam-pluggable-authentication-modules">19. PAM (Pluggable Authentication Modules)</h1>
<p>ログインのユーザー認証や、sudo, polkitのパスワード認証の裏側にあるものでLinuxの認証機能は大体これを理解すればなんとかなる。設定は/etc/pam.d以下にある。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>auth		required	pam_env.so
auth		requisite	pam_faillock.so preauth
auth		[success=1 new_authtok_reqd=1 ignore=ignore default=bad]	pam_unix.so nullok  try_first_pass
auth		[default=die]	pam_faillock.so authfail
</code></pre>
<p>設定ファイルはシンプルで上から順に処理を実行する。個別の意味については<code>man pam.d</code>で。</p>
<p>詳しくはArchWikiへ。<br />
<a href="https://wiki.archlinux.jp/index.php/PAM">https://wiki.archlinux.jp/index.php/PAM</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" lang="en-US">
<h1 id="20-yubikey">20. Yubikey</h1>
<p>Yubikeyを使ってLinuxの認証を行うことができる。<a href="https://developers.yubico.com/pam-u2f/">pam_u2f</a>をインストールしてpam.dの設定を変更することでFIDO 2でLinuxの認証が行える様になる。<br />
1passwordもロック解除できる様になる。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code># /etc/pam.d/system-local-login
auth	sufficient	pam_u2f.so origin=pam://hostname appid=pam://hostname cue openasuser pinverification=1
auth	include	system-login
# 以下略
</code></pre>
<p>sufficientであればこれを満たした時点で成功になる。2要素認証にしたい場合はrequiredにする。<br />
CLIであればPINの入力を要求するpromptが出る。GUIの場合はパスワードの代わりにPINを入力してからデバイスにタッチすれば認証できる。<br />
詳しくは俺のブログ記事へ。<br />
<a href="https://joker1007.hatenablog.com/entry/2025/11/25/023018">https://joker1007.hatenablog.com/entry/2025/11/25/023018</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" lang="en-US">
<h1 id="21-screen-locker">21. Screen Locker</h1>
<p>昔はxscreensaverとかを利用していたが、今はWaylandのためのidle managementアプリとlockアプリを利用する。<br />
以下のものを組み合わせれば何とかなる。</p>
<ul>
<li>swayidle or hypridle</li>
<li>swaylock or hyprlock</li>
</ul>
<p>Hyprlandユーザーならhypridleをuwsm + systemdで起動して、そこからhyprlockを起動する設定にするのが良いと思う。<br />
ちなみにロック解除もPAMを経由するのでYubikey認証もできる。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" lang="en-US">
<h1 id="22-%E3%83%87%E3%82%A3%E3%82%B9%E3%83%97%E3%83%AC%E3%82%A4%E7%AE%A1%E7%90%86">22. ディスプレイ管理</h1>
<p>Hyprlandなら設定ファイルで直接モニター設定を弄るのが基本になる。</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>monitor=HDMI-A-1, 1920x1080@60, auto, 1, bitdepth, 10
</code></pre>
<p>アプリケーションで上手く設定するなら<a href="https://hyprdynamicmonitors.filipmikina.com/">hyprdynamicmonitors</a>がオススメ。<br />
ディスプレイの接続状況などから動的に設定を自動更新したり、TUIで直感的に設定変更できるが多機能過ぎるかもしれない。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" lang="en-US">
<h1 id="23-%E3%82%AD%E3%83%BC%E3%83%AA%E3%83%9E%E3%83%83%E3%83%94%E3%83%B3%E3%82%B0">23. キーリマッピング</h1>
<p><a href="https://github.com/jtroo/kanata">kanata</a>を利用するのがオススメ。Rust製でMacでもWindowsでも使える。</p>
<p>レイヤー作ってマップを切り替えたり、マウスを操作したりマクロを設定したりできる。<br />
こんな感じでマッピングとかレイヤーを定義して、どこで切り替えるとかを設定する</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>(deflayer mouse
  _    _    _    _    _    _    _    _    _    _    _    _    _    _
  _    _    _    _    lrld _    _    @mal @mad @mau @mar _    _    _
  _    _    @slw _    @fst _    @msl @msd @msu @msr _    _    _
  _    _    _    _    _    _    mlft mrgt _    _    _    _
       _    _              _              _    @rat
)
</code></pre>
<p><a href="https://github.com/jtroo/kanata/blob/main/docs/config.adoc">https://github.com/jtroo/kanata/blob/main/docs/config.adoc</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" lang="en-US">
<h1 id="24-font">24. Font</h1>
<p>システムレベルのフォントは<code>/usr/share/fonts</code>に、個別のユーザーレベルのフォントは<code>~/.local/share/fonts</code>に配置する。<br />
フォントを追加した時は<code>fc-cache</code>を実行してキャッシュを更新すること。</p>
<p>個人的なおすすめフォントは<a href="https://github.com/miiton/Cica">Cica</a>と<a href="https://github.com/yuru7/udev-gothic">UDEVGothic</a>。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" lang="en-US">
<h1 id="25-%E6%97%A5%E6%9C%AC%E8%AA%9E%E5%85%A5%E5%8A%9B">25. 日本語入力</h1>
<p>wayland環境ならibusよりfcitxを利用する方が良いと思う。<br />
日本語変換のエンジンは基本クオリティが微妙なので、個人的にはfcitx-skkをインストールしてskkに慣れるのを一番オススメする。</p>
<p>今なら<a href="https://github.com/7ka-Hiira/fcitx5-hazkey">fcitx-haskey</a>をインストールしてニューラルかな漢字変換システムZenzaiを利用するのも良いかもしれない。日本語変換なのにGPUをバリバリ使うので楽しそう。<br />
自分はskkに最適化されてしまったので利用していない。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" lang="en-US">
<h1 id="26-clipboard%E7%AE%A1%E7%90%86">26. Clipboard管理</h1>
<p><a href="https://benz.gitbook.io/walker/">walker+elephent</a>に任せるか<a href="https://github.com/bugaevc/wl-clipboard">wl-paste</a>と<a href="https://github.com/sentriz/cliphist">cliphist</a>を使って管理する。</p>
<p>後者の場合はwofiなどを利用して保持されているものピックアップする設定も必要。</p>
<p>ちなみにLinuxのクリップボードは歴史的な理由によりPRIMARYとCLIPBOARDの二つがある。<br />
それぞれが何と対応しているのかは正直かなり分かりにくい。<br />
詳しくはArchWikiへ。<br />
<a href="https://wiki.archlinux.jp/index.php/%E3%82%AF%E3%83%AA%E3%83%83%E3%83%97%E3%83%9C%E3%83%BC%E3%83%89">https://wiki.archlinux.jp/index.php/クリップボード</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" lang="en-US">
<h1 id="27-%E9%9F%B3%E6%A5%BD%E5%86%8D%E7%94%9F">27. 音楽再生</h1>
<p><a href="https://mpd.readthedocs.io/en/stable/">mpd</a>となんらかのフロントエンドを利用するのが良い。<br />
管理用のサーバープロセスとフロントエンド分けるの面倒臭くない？と思うかもしれないが、結局これが一番潰しが効く。</p>
<p>フロントエンドのオススメはGUIなら<a href="https://github.com/nullobsi/cantata">cantata</a>で、TUIなら<a href="https://github.com/mierak/rmpc">rmpc</a></p>
<h2 id="%E4%B8%80%E9%83%A8%E3%81%AE%E3%82%AA%E3%83%BC%E3%83%87%E3%82%A3%E3%82%AA%E3%83%9E%E3%83%8B%E3%82%A2%E5%90%91%E3%81%91">一部のオーディオマニア向け</h2>
<p>replaygainを算出してタグに付与したい場合は<a href="https://github.com/complexlogic/rsgain">rsgain</a>を利用するのがオススメ。<br />
またmpdでDSDのネイティブ再生も可能です。DACの対応がカーネルに無ければパッチを当てる必要があるかも。<br />
気になる人は直接聞いてください。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" lang="en-US">
<h1 id="28-%E5%8B%95%E7%94%BB%E5%86%8D%E7%94%9F">28. 動画再生</h1>
<p><a href="https://mpv.io/">mpv</a>を使っておけば良い。特に困ることは無い。<br />
UIをリッチにしたいなら、<a href="https://github.com/tomasklaen/uosc">uosc</a>を入れるのがオススメ。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" lang="en-US">
<h1 id="29-hdr">29. HDR</h1>
<p>最新のHyprlandを利用しているならHDRでディスプレイ出力ができる。<br />
主な用途はゲームか動画再生。</p>
<p>詳しくは俺のブログへ。<br />
<a href="https://joker1007.hatenablog.com/entry/2025/03/19/180603">https://joker1007.hatenablog.com/entry/2025/03/19/180603</a><br />
<a href="https://joker1007.hatenablog.com/entry/2024/12/18/201907">https://joker1007.hatenablog.com/entry/2024/12/18/201907</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" lang="en-US">
<h1 id="30-%E7%94%BB%E5%83%8F%E3%83%93%E3%83%A5%E3%83%BC%E3%83%AF%E3%83%BC">30. 画像ビューワー</h1>
<p>シンプルな用途なら<a href="https://github.com/artemsen/swayimg">swayimg</a>が良い。十分なサポート形式、軽量、ギャラリーモードあり。<br />
zipアーカイブでまとめてる場合などは<a href="https://sourceforge.net/projects/mcomix/">mcomix</a>がオススメ。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" lang="en-US">
<h1 id="31-%E5%A3%81%E7%B4%99">31. 壁紙</h1>
<p>Hyprlandユーザーなら<a href="https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/">hyprpaper</a>を利用しておけば良いと思う。<br />
GUIで設定を変えたいなら<a href="https://anufrievroman.gitbook.io/waypaper">waypaper</a>がオススメ。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" lang="en-US">
<h1 id="32-%E5%8B%95%E7%94%BB%E9%85%8D%E4%BF%A1">32. 動画配信</h1>
<p>OBSが普通に使える。Linux向けのプラグインとしては以下の様なものがある。</p>
<ul>
<li><a href="https://github.com/nowrep/obs-vkcapture">obs-vkcapture</a>: Vulkanを利用するゲーム画面キャプチャ。デスクトップ描画を経由しないので軽いし高画質。</li>
<li><a href="https://github.com/dimtpap/obs-pipewire-audio-capture">obs-pipewire-audio-capture</a>: pipewireを直接使ってオーディオのキャプチャを行う。</li>
<li><a href="https://github.com/fzwoch/obs-vaapi">obs-vaapi</a>: GPUエンコードのサポート。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" lang="en-US">
<h1 id="33-%E9%9F%B3%E5%A3%B0%E5%8A%A0%E5%B7%A5">33. 音声加工</h1>
<p>GUIアプリとしては<a href="https://www.audacityteam.org/">Audacity</a>が定番。エフェクトのためのプラグインが多く存在する。LADSPA(拡張形式のLV2)というプラグインシステムがLinux特有なので覚えておこう。<br />
pipewireの設定を利用してマイク入力にLADSPAのプラグインを利用してエフェクトをかけたりできる。</p>
<p>よく利用される音声加工のエフェクトプラグインは以下。</p>
<ul>
<li><a href="https://github.com/wwmm/easyeffects">easyeffects</a> (pipewireに直接エフェクトをかける。大体これで良い)</li>
<li><a href="http://calf-studio-gear.org/">calf</a></li>
<li><a href="https://github.com/lsp-plugins/lsp-plugins">lsp-plugins</a></li>
<li><a href="https://github.com/swh/lv2">swh-lv2</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" lang="en-US">
<h1 id="%E3%83%8E%E3%82%A4%E3%82%BA%E3%82%AD%E3%83%A3%E3%83%B3%E3%82%BB%E3%83%AA%E3%83%B3%E3%82%B0%E3%82%92%E3%81%8B%E3%81%91%E3%82%8B%E3%82%B5%E3%83%B3%E3%83%97%E3%83%AB">ノイズキャンセリングをかけるサンプル</h1>
<p><a href="https://github.com/werman/noise-suppression-for-voice">noise-suppression-for-voice</a>を利用している</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sh">context.modules = [
  {   name = libpipewire-module-filter-chain
      args = {
          node.description =  <span class="hljs-string">&quot;Noise Canceling source&quot;</span>
          media.name =  <span class="hljs-string">&quot;Noise Canceling source&quot;</span>
          filter.graph = {
              nodes = [
                  {
                      <span class="hljs-built_in">type</span> = ladspa
                      name = rnnoise
                      plugin = /home/joker/.ladspa/librnnoise_ladspa.so
                      label = noise_suppressor_mono
                      control = {
                          <span class="hljs-string">&quot;VAD Threshold (%)&quot;</span> = 90.0
                          <span class="hljs-string">&quot;VAD Grace Period (ms)&quot;</span> = 200
                      }
                  }
              ]
          }
          capture.props = {
              node.name =  <span class="hljs-string">&quot;rnnoise_source.input&quot;</span>
              audio.position = [ MONO ]
              node.passive = <span class="hljs-literal">true</span>
              audio.rate = 48000
          }
          playback.props = {
              node.name =  <span class="hljs-string">&quot;rnnoise_source.output&quot;</span>
              audio.position = [ MONO ]
              media.class = Audio/Source
              audio.rate = 48000
          }
      }
  }
]
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" lang="en-US">
<h1 id="34-%E5%8B%95%E7%94%BB%E5%8A%A0%E5%B7%A5">34. 動画加工</h1>
<p>シンプル用途なら<a href="https://avidemux.sourceforge.net/">avidemux</a>が昔から使われている。<br />
高機能なビデオエディタなら<a href="https://invent.kde.org/multimedia/kdenlive">kdenlive</a>、<a href="https://github.com/OpenShot/openshot-qt">openshot</a>, <a href="https://github.com/mltframework/shotcut">shotcut</a>辺りだと思う。<br />
自分はkdenliveしか使ったことがない。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" lang="en-US">
<h1 id="35-vpn">35. VPN</h1>
<p>tailscaleを使っておくのが一番楽だと思う。Macでも多分同じ。<br />
systemd-networkdならDNSの設定とかも良い感じに自動で調整してくれる。<br />
NetworkManagerの場合はよく知らない。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" lang="en-US">
<h1 id="36-kernel-compile">36. Kernel Compile</h1>
<p>とりあえず基本的な注意点だけ。<br />
GPUのドライバ、Framebuffer、ストレージのドライバだけはきっちり確認して有効化しておくこと。<br />
こいつらが欠けてるとブートそのものに失敗したり画面に何も出なくて自分がフリーズすることになる。</p>
<p>後は8割ぐらいは必要なデバイスドライバを探して有効化していくのがメイン。<br />
慣れれば1発か2発で起動に成功する。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" lang="en-US">
<h1 id="37-%E3%82%BD%E3%83%BC%E3%82%B9%E3%81%8B%E3%82%89%E3%81%AE%E3%82%B3%E3%83%B3%E3%83%91%E3%82%A4%E3%83%AB%E3%81%A8%E3%82%A4%E3%83%B3%E3%82%B9%E3%83%88%E3%83%BC%E3%83%AB">37. ソースからのコンパイルとインストール</h1>
<p>ソースから何かをコンパイルして入れる場合は、/usr/localに入れるより/opt以下にそのソフトウェア専用のディレクトリを用意してインストールのprefixをそこに設定して、必要なパスを個別に設定する方が個人的には好み。<br />
最悪消したくなった時はそのディレクトリを削除すれば良いし、他のソフトウェアとごっちゃにならない。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" lang="en-US">
<h1 id="38-ebuild">38. ebuild</h1>
<p>Gentooユーザーならebuildが書ける様になると、自分で好きなものをコンパイルしてインストールしつつパッケージマネージャーに管理を任せられる。<br />
自分のローカルで利用するportageのoverlayを用意しておくと良い。<br />
大抵の場合は他のebuildを参考にシェルスクリプトを多少書くだけで大丈夫。</p>
<ul>
<li><a href="https://wiki.gentoo.org/wiki/Creating_an_ebuild_repository">https://wiki.gentoo.org/wiki/Creating_an_ebuild_repository</a></li>
<li><a href="https://wiki.gentoo.org/wiki/Basic_guide_to_write_Gentoo_Ebuilds">https://wiki.gentoo.org/wiki/Basic_guide_to_write_Gentoo_Ebuilds</a></li>
<li><a href="https://devmanual.gentoo.org/">https://devmanual.gentoo.org/</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" lang="en-US">
<h1 id="39-gaming">39. Gaming</h1>
<p>SteamがかなりLinux環境でのPCゲームに力を入れているので、大半のゲームは普通に動作する。<br />
Arch Linux系なら普通にsteamパッケージを入れればいい。<br />
Gentoo系なら<code>eselect repository enable steam-overlay</code>でOverlayを有効にしてsteam-launcherをインストールする。<br />
基本的にProtonのおかげで大体のゲームは動作するが、コピーガードやアンチチートなどが邪魔することもある。<br />
描画パフォーマンスなどを最適化するならいくつかのツールを活用した方がいい。<br />
とりあえず<a href="https://github.com/sonic2kk/steamtinkerlaunch">steamtinkerlaunch</a>と<a href="https://github.com/ValveSoftware/gamescope">gamescope</a>を利用することをオススメする。</p>
<p>詳しくは俺のブログへ。<br />
<a href="https://joker1007.hatenablog.com/entry/2022/11/28/014825">https://joker1007.hatenablog.com/entry/2022/11/28/014825</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" lang="en-US">
<h1 id="40-gpu">40. GPU</h1>
<p>nvidia系のGPUを利用する場合はプロプライエタリのドライバが必要になる。<br />
CUDAを使いたいならnvidiaにするしかないが、AMDのGPUはちゃんとカーネルにコントリビュートしていて本体にドライバが組込まれているので、CUDAが滅茶苦茶必要という訳でないならAMDをオススメする。<br />
(AI需要でちょっとAMDの肩身が狭いが……)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" lang="en-US">
