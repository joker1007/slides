<h1 id="schema-registry%E3%81%AE%E6%B4%BB%E7%94%A8">Schema Registryの活用</h1>
<ul>
<li>大半のスキーマは独立したリポジトリに配置し、特定のサービスに所属させない共通の基盤として扱う。</li>

<p>外から触っていいのは基本的にコントローラー、サービス、ジョブ辺りだと思う。<br />
モデルのメソッドを直接呼ぶのは警戒した方が良い。</p>
<p>外部との接点には型を書く。<br />
I/Fの破壊に気付き易くなるし、ドキュメント・補完で利用方法をガイドできる。<br />
コントローラー呼び出しを挟むならスキーマ管理機構は必須。</p>
<p>この辺り、モジュラーモノリスでもマイクサービスでもやる事は余り変わらない。</p>

/*
Rosé Pine theme create by RAINBOWFLESH
&gt; www.rosepinetheme.com

palette in :root
*/

@import &quot;default&quot;;
@import &quot;schema&quot;;
@import &quot;structure&quot;;

:root {
    --base: #191724;
    --surface: #1f1d2e;
    --overlay: #26233a;
    --muted: #6e6a86;
    --subtle: #e0def4;
    --text: #e0def4;
    --love: #eb6f92;
    --gold: #f6c177;
    --rose: #ebbcba;
    --pine: #31748f;
    --foam: #9ccfd8;
    --iris: #c4a7e7;
    --highlight-low: #21202e;
    --highlight-muted: #403d52;
    --highlight-high: #524f67;

    font-family: Pier Sans, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, Noto Sans,
        sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, Segoe UI Symbol,
        &quot;Noto Color Emoji&quot;;
    font-weight: initial;

    background-color: var(--base);
}
/* Common style */
h1 {
    color: var(--rose);
    padding-bottom: 2mm;
    margin-bottom: 12mm;
}
h2 {
    color: var(--rose);
}
h3 {
    color: var(--rose);
}
h4 {
    color: var(--rose);
}
h5 {
    color: var(--rose);
}
h6 {
    color: var(--rose);
}
a {
    color: var(--iris);
}
p {
    font-size: 20pt;
    font-weight: 600;
    color: var(--text);
}
code {
    color: var(--text);
    background-color: var(--highlight-muted);
}
text {
    color: var(--text);
}
ul {
    color: var(--subtle);
}
li {
    color: var(--subtle);
}
img {
    background-color: var(--highlight-low);
}
strong {
    color: var(--text);
    color: var(--gold);
    font-weight: inherit;
    font-weight: 800;
}
mjx-container {
    color: var(--text);
}
marp-pre {
    background-color: var(--overlay);
    border-color: var(--highlight-high);
}

/* Code blok */
.hljs-comment {
    color: var(--muted);
}
.hljs-attr {
    color: var(--foam);
}
.hljs-punctuation {
    color: var(--subtle);
}
.hljs-string {
    color: var(--gold);
}
.hljs-title {
    color: var(--foam);
}
.hljs-keyword {
    color: var(--pine);
}
.hljs-variable {
    color: var(--text);
}
.hljs-literal {
    color: var(--rose);
}
.hljs-type {
    color: var(--love);
}
.hljs-number {
    color: var(--gold);
}
.hljs-built_in {
    color: var(--love);
}
.hljs-params {
    color: var(--iris);
}
.hljs-symbol {
    color: var(--foam);
}
.hljs-meta {
    color: var(--subtle);
}

footer {
    color: var(--text);
}
